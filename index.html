<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>GSDC In &amp; Out</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  document.documentElement.dataset.theme = localStorage.getItem('gsdc-theme') ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<style>
  :root, [data-theme="dark"] {
    --bg:#0b1224; --card:rgba(22,32,58,.88); --field:#0b1224; --border:#3a4a6b; --text:#f1f5f9; --muted:#b6c2d6;
    --ok:#22c55e; --warn:#f59e0b; --bad:#f87171; --accent:#2f5fe0; --enroll:#15803d; --logo-op:.10; color-scheme:dark;
  }
  [data-theme="light"] {
    --bg:#f4f6fb; --card:rgba(255,255,255,.9); --field:#ffffff; --border:#c3cad8; --text:#0f172a; --muted:#475569;
    --ok:#15803d; --warn:#b45309; --bad:#c81e2a; --accent:#0a1a6b; --enroll:#15803d; --logo-op:.12; color-scheme:light;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); transition:background .2s,color .2s; position:relative; }
  /* GSDC logo watermark behind everything */
  body::before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background-image:url("./gsdc-logo.png"); background-repeat:no-repeat; background-position:center; background-size:min(80vw,520px); opacity:var(--logo-op); filter:brightness(1.1); }
  header { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; padding:10px 12px; max-width:100%; margin:0 auto; width:100%; box-sizing:border-box; }
  .hleft { display:flex; align-items:center; gap:8px; min-width:0; }
  header h1 { font-size:18px; margin:0; }
  #clock { font-variant-numeric:tabular-nums; color:var(--muted); }
  .hright { display:flex; align-items:center; justify-self:end; gap:10px; }
  #btnTheme { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--card); color:var(--text); padding:6px 10px; border-radius:999px; font-size:14px; cursor:pointer; }
  .theme-track { position:relative; display:inline-flex; align-items:center; justify-content:space-between; width:44px; height:24px; padding:0 5px; border-radius:999px; background:#64748b; color:#fff; }
  .theme-track svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .theme-thumb { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.3); transition:transform .32s cubic-bezier(.2,.8,.2,1); }
  #btnTheme.is-dark .theme-track { background:#334155; }
  #btnTheme.is-dark .theme-thumb { transform:translateX(20px); }
  #btnTheme:active .theme-thumb { width:23px; }
  .action-icon { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; vertical-align:middle; }
  .action-icon svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  nav { display:flex; gap:8px; padding:0 16px 12px; max-width:min(1200px,98vw); margin:0 auto; }
  nav button { flex:1; padding:10px; border:0; border-radius:8px; background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; }
  nav button.on { background:var(--accent); color:#fff; }
  main { max-width: 100%; margin:0 auto; padding:0 8px; width:100%; box-sizing:border-box; }
  .cam { position:relative; border-radius:12px; overflow:hidden; background:#000; width:100%; aspect-ratio:4/3; height: min(calc(100vw - 16px) * 3 / 4, 72dvh); max-height: 75dvh; }
  video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); clip-path:ellipse(min(32%, 180px) 39% at 50% 50%); }
  .face-guide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .face-guide::before { content:""; width:min(64%, 360px); height:78%; border:3px solid rgba(255,255,255,.9); border-radius:50%; box-shadow:0 0 18px rgba(255,255,255,.35); }
  .face-guide-label { position:absolute; bottom:52px; left:50%; transform:translateX(-50%); max-width:calc(100% - 32px); padding:7px 12px; border-radius:999px; background:rgba(15,23,42,.78); color:#fff; text-align:center; font-size:13px; white-space:nowrap; }
  #badge { position:absolute; left:10px; right:10px; bottom:10px; padding:8px 12px; border-radius:8px; background:rgba(15,23,42,.85); color:#fff; text-align:center; font-size:14px; }
  #badge.ok { background:rgba(21,128,61,.95); } #badge.warn { background:rgba(245,158,11,.9); color:#000; } #badge.bad { background:rgba(185,28,28,.95); }
  #result { margin-top:14px; padding:18px; border-radius:12px; background:var(--card); text-align:center; min-height:84px; }
  #result .type { font-size:34px; font-weight:700; }
  #result .IN { color:var(--ok); } #result .OUT { color:var(--warn); } #result .ERR { color:var(--bad); font-size:18px; }
  #result .name { font-size:20px; margin-top:4px; } #result .time { color:var(--muted); margin-top:2px; }
  .gps-status { margin-top:10px; font-size:13px; color:var(--muted); text-align:center; }
  .form { margin-top:14px; background:var(--card); padding:16px; border-radius:12px; display:grid; gap:10px; }
  .form input { padding:11px; border-radius:8px; border:1px solid var(--border); background:var(--field); color:var(--text); font-size:15px; }
  .form button { padding:12px; border:0; border-radius:8px; background:var(--enroll); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .identity-form { margin-top:10px; }
  .identity-form button[type="button"] { background:var(--card); color:var(--text); border:1px solid var(--border); }
  #identityError { min-height:20px; color:var(--bad); text-align:center; font-size:14px; }
  .form button:disabled { opacity:.5; }
  #enrollMsg { font-size:14px; text-align:center; color:var(--muted); min-height:20px; }
  .back { border:0; background:var(--card); color:var(--text); padding:8px 12px; border-radius:8px; font-size:14px; cursor:pointer; }
  #home { max-width:520px; margin:0 auto; padding:24px 16px; display:grid; gap:14px; }
  #home .lead { text-align:center; color:var(--muted); margin:0 0 6px; }
  .choice { display:flex; align-items:center; gap:16px; padding:20px; border:0; border-radius:14px; color:#fff; cursor:pointer; text-align:left; }
  .choice.scan { background:var(--accent); } .choice.enroll { background:var(--enroll); }
  .choice-copy { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .choice .big { font-size:26px; font-weight:700; white-space:nowrap; } .choice .sub { font-size:14px; opacity:.85; white-space:nowrap; }
  .scan-visual { position:relative; display:block; flex:none; width:56px; height:56px; color:#fff; }
  .scan-visual svg { display:block; width:100%; height:100%; }
  .scan-line { position:absolute; left:11px; right:11px; top:9px; height:2px; border-radius:2px; background:#67f5e5; box-shadow:0 0 8px #67f5e5; animation:faceScanSweep 1.8s ease-in-out infinite alternate; }
  #chooseScan:disabled .scan-line { animation-play-state:paused; }
  #chooseEnroll:disabled .scan-line { animation-play-state:paused; }
  @keyframes faceScanSweep { from { top:9px; } to { top:45px; } }
  .action-icon { flex:none; margin-right:8px; }
  .face-scan-icon { position:relative; }
  .face-scan-icon svg { width:22px; height:22px; }
  .face-scan-icon::after { content:""; position:absolute; left:3px; right:3px; top:4px; height:2px; border-radius:2px; background:#67f5e5; box-shadow:0 0 6px #67f5e5; }
  #identitySubmit .face-scan-icon::after, #btnEnroll:not(.is-saving) .face-scan-icon::after { animation:actionScanSweep 1.5s ease-in-out infinite alternate; }
  @keyframes actionScanSweep { to { top:16px; } }
  #btnEnroll .face-scan-icon::before { content:""; position:absolute; inset:2px; border:2px solid currentColor; border-radius:50%; opacity:0; transform:scale(.5); }
  #btnEnroll.is-saving .face-scan-icon::after { animation:none; opacity:0; }
  #btnEnroll.is-saving .face-scan-icon::before { animation:saveFlash .65s ease-out both; }
  @keyframes saveFlash { 30% { opacity:.9; transform:scale(.65); } 100% { opacity:0; transform:scale(1.45); } }
  .back-icon { width:16px; height:16px; vertical-align:-3px; margin-right:4px; }
  #btnBack:not(:disabled):hover .back-icon { animation:backArrowNudge .45s ease; }
  @keyframes backArrowNudge { 50% { transform:translateX(-5px); } }
  .choice:disabled { opacity:.5; cursor:wait; }
  button { transition:transform .18s ease, box-shadow .18s ease, filter .18s ease; }
  button:not(:disabled):hover { transform:translateY(-2px); filter:brightness(1.08); box-shadow:0 6px 16px rgba(0,0,0,.2); }
  button:not(:disabled):active { transform:translateY(0) scale(.97); filter:brightness(.96); box-shadow:none; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  button:disabled { cursor:not-allowed; }
  #homeMsg { text-align:center; font-size:14px; color:var(--muted); min-height:20px; }
  #prompt { position:absolute; left:10px; right:10px; top:10px; padding:12px; border-radius:10px; background:rgba(59,130,246,.92); text-align:center; font-size:20px; font-weight:700; }
  [hidden] { display:none !important; }
  @media (max-width:600px) {
    .cam { aspect-ratio:auto; height:min(72dvh, calc(100dvh - 260px)); max-height:none; }
    video { clip-path:ellipse(min(39%, 190px) 36% at 50% 50%); }
    .face-guide::before { width:min(78%, 380px); height:72%; }
  }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:1000; animation:fadeIn 0.3s ease; }
  .modal { background:var(--card); border-radius:16px; max-width:400px; width:90%; padding:32px 24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.5); border:2px solid var(--border); animation:scaleIn 0.3s ease; position:relative; overflow:hidden; }
  .modal.success { border-color:var(--ok); }
  .modal.warning { border-color:var(--warn); }
  .modal-icon { font-size:64px; margin-bottom:16px; display:block; animation:bounce 0.6s ease; }
  .modal-title { font-size:24px; font-weight:700; margin:0 0 12px; }
  .modal.success .modal-title { color:var(--ok); }
  .modal.warning .modal-title { color:var(--warn); }
  .modal-message { font-size:16px; color:var(--text); margin:0 0 24px; line-height:1.5; }
  .modal-btn { padding:12px 32px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .modal.success .modal-btn { background:var(--ok); }
  .modal.warning .modal-btn { background:var(--warn); color:#000; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes scaleIn { from { transform:scale(0.8); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes bounce { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  @media (prefers-reduced-motion:reduce) {
    button { transition:none; }
    button:not(:disabled):hover, button:not(:disabled):active { transform:none; }
    .scan-line { animation:none; top:27px; }
    .theme-thumb { transition:none; }
    #btnBack:not(:disabled):hover .back-icon, .face-scan-icon::after, #btnEnroll.is-saving .face-scan-icon::before { animation:none; }
    .scan-line { animation:none; top:27px; }
  }
  #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1001; }
</style>
</head>
<body>
<header><div class="hleft"><button id="btnBack" class="back" hidden><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>Back</button><h1 id="appTitle">GSDC In &amp; Out</h1></div><div id="clock"></div><div class="hright"><button id="btnTheme" type="button" aria-label="Switch dark / light mode"><span class="theme-track" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2m16 0h2"/></svg><svg viewBox="0 0 24 24"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg><span class="theme-thumb"></span></span><span id="themeLabel"></span></button></div></header>

<div id="gps" class="gps-status" aria-live="polite">GPS: waiting…</div>

<section id="home">
  <p class="lead">What would you like to do?</p>
  <button class="choice scan" id="chooseScan"><span class="scan-visual" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 21V13a4 4 0 0 1 4-4h8M43 9h8a4 4 0 0 1 4 4v8M55 43v8a4 4 0 0 1-4 4h-8M21 55h-8a4 4 0 0 1-4-4v-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M20 28c0-8 5-13 12-13s12 5 12 13v5c0 9-5 15-12 15s-12-6-12-15v-5Z" stroke="currentColor" stroke-width="2.5"/><path d="M25 29h.1M39 29h.1M28 39c2.5 2 5.5 2 8 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span class="scan-line"></span></span><span class="choice-copy"><span class="big">Scan</span><span class="sub">Face scan for Time In / Time Out</span></span></button>
  <button class="choice enroll" id="chooseEnroll"><span class="scan-visual" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 21V13a4 4 0 0 1 4-4h8M43 9h8a4 4 0 0 1 4 4v8M55 43v8a4 4 0 0 1-4 4h-8M21 55h-8a4 4 0 0 1-4-4v-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="28" cy="25" r="7" stroke="currentColor" stroke-width="2.5"/><path d="M15 46v-3a9 9 0 0 1 9-9h8M43 25v13m-6.5-6.5h13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span class="scan-line"></span></span><span class="choice-copy"><span class="big">Enroll</span><span class="sub">Register a new employee's face</span></span></button>
  <div id="homeMsg">Loading…</div>
</section>

<main id="app" hidden>
  <div class="cam" id="camPane">
    <video id="video" autoplay muted playsinline></video>
    <div class="face-guide" aria-hidden="true"><span class="face-guide-label">Center your face inside the oval</span></div>
    <div id="prompt" hidden></div>
    <div id="badge">Starting…</div>
  </div>

  <section id="scanPane">
    <form id="identityForm" class="form identity-form" hidden>
      <label for="identityInput">Enter your employee ID before the face scan:</label>
      <input id="identityInput" autocomplete="off" required aria-describedby="identityError">
      <div id="identityError" aria-live="polite"></div>
      <button id="identitySubmit" type="submit"><span class="action-icon face-scan-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/><path d="M8 10a4 4 0 0 1 8 0v2a4 4 0 0 1-8 0v-2Z"/></svg></span>Continue to face scan</button>
    </form>
    <div id="scanActions" class="form" hidden>
      <div id="scanEmployee" aria-live="polite"></div>
      <button type="button" id="retryScan">Retry face scan</button>
      <button type="button" id="cancelScan">Cancel / enter another ID</button>
    </div>
    <div id="result"><div style="color:var(--muted)">Look at the camera, then follow the on-screen instructions to record IN / OUT</div></div>
  </section>

  <section id="enrollPane" hidden>
    <div class="form">
      <input id="pin" type="password" placeholder="Admin PIN" autocomplete="off">
      <input id="empId" placeholder="Employee ID">
      <input id="empName" placeholder="Full name (First Name Middle Name Last Name)">
      <button id="btnEnroll"><span class="action-icon face-scan-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/><path d="M8 10a4 4 0 0 1 8 0v2a4 4 0 0 1-8 0v-2Z"/></svg></span>Capture face &amp; save</button>
      <div id="enrollMsg">Face the camera, then press the button.</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const $ = id => document.getElementById(id);
const setGPSStatus = text => { $('gps').textContent = text; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const detOpts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
const fastOpts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 });
const ENROLL_DUPLICATE_THRESHOLD = 0.4;

let enrollmentMatcher = null, names = {}, employeeDescriptors = new Map(), cfg = { threshold: 0.5 };
let mode = 'home', busy = false, pos = null, activeScanId = null;

// ====== SET THESE TWO ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwdfR3fnuDQpwsYbkpax_MW2oDCn8ypL5_wjkTreKf6X6fHjLHi1CmeoUyu8ZHhf2bF/exec'; // ends with /exec
const API_KEY = 'x7Kp29qLmA';               // same as API_KEY in the Config tab
// ===========================

async function gs(fn, ...args) {
  // No Content-Type header on purpose: keeps it a "simple" request so Apps Script accepts it from another site.
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: API_KEY, fn: fn, args: args }) });
  if (!res.ok) throw new Error('Server error ' + res.status);
  return res.json();
}
function badge(text, cls) { const b = $('badge'); b.textContent = text; b.className = cls || ''; }
function say(text) { const p = $('prompt'); p.textContent = text || ''; p.hidden = !text; }

/* Confetti */
function shootConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (typeof confetti === 'function') {
    const myConfetti = confetti.create(canvas, { resize: true, useWorker: true });
    const duration = 3000;
    const end = Date.now() + duration;
    (function frame() {
      myConfetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
      myConfetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
      if (Date.now() < end) { requestAnimationFrame(frame); }
    }());
  }
}

/* Modal */
function showModal(opts) {
  const overlay = document.getElementById('appModal');
  const modal = document.getElementById('modalContent');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const msg = document.getElementById('modalMessage');
  const btn = document.getElementById('modalBtn');
  modal.className = 'modal ' + (opts.type || '');
  icon.textContent = opts.icon || '🎉';
  title.textContent = opts.title || 'Success!';
  msg.textContent = opts.message || '';
  btn.onclick = function() { overlay.style.display = 'none'; };
  overlay.style.display = 'flex';
  if (opts.type === 'success') { shootConfetti(); }
}

/* Dark / light mode */
function paintThemeBtn() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('btnTheme').classList.toggle('is-dark', dark);
  $('themeLabel').textContent = dark ? 'Light' : 'Dark';
  $('btnTheme').setAttribute('aria-label', 'Switch to ' + (dark ? 'light' : 'dark') + ' mode');
}
$('btnTheme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('gsdc-theme', t);
  paintThemeBtn();
};
paintThemeBtn();

/* Clock */
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

/* ---------- Screens: home (no camera) -> Scan or Enroll ---------- */
let stream = null, gpsWatch = null, session = 0;

async function startCamera() {
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    throw new Error('Camera API unavailable. Do not open this file directly (file://). Run it via http://localhost or http://127.0.0.1 with a local server, and use Chrome/Edge.');
  }
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
  const v = $('video');
  v.srcObject = stream;
  await new Promise(r => { v.onloadedmetadata = r; });
  await v.play();
}
function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
}

async function openModule(m) {
  mode = m;
  const my = ++session;
  $('home').hidden = true; $('app').hidden = false; $('btnBack').hidden = false;
  $('appTitle').hidden = true;
  $('scanPane').hidden = m !== 'scan';
  $('enrollPane').hidden = m !== 'enroll';
  $('camPane').hidden = m === 'scan';
  $('result').innerHTML = '<div style="color:var(--muted)">Look at the camera, then follow the on-screen instructions to record IN / OUT</div>';
  $('identityForm').hidden = m !== 'scan';
  $('scanActions').hidden = true;
  activeScanId = null;
  $('identityInput').value = '';
  $('identityError').textContent = '';
  $('enrollMsg').textContent = 'Face the camera, then press the button.';
  say(''); busy = false;
  if (m === 'scan') {
    badge('Enter employee ID to begin');
    return;
  }
  try {
    badge('Starting camera…');
    await startCamera();
    if (my !== session) { stopCamera(); return; }
    badge('Ready');
  } catch (e) {
    badge('Camera error: ' + (e.message || e), 'bad');
  }
}
function goHome() {
  session++; mode = 'home'; busy = false;
  activeScanId = null;
  stopCamera(); say('');
  $('app').hidden = true; $('home').hidden = false; $('btnBack').hidden = true;
  $('appTitle').hidden = false;
}
$('chooseScan').onclick = () => openModule('scan');
$('chooseEnroll').onclick = () => openModule('enroll');
$('btnBack').onclick = goHome;

/* GPS */
function startGPS() {
  if (!navigator.geolocation) { setGPSStatus('GPS not supported'); return; }
  if (gpsWatch !== null) return;
  gpsWatch = navigator.geolocation.watchPosition(
    p => {
      pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
      setGPSStatus('GPS: ' + pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5) + ' (±' + Math.round(pos.acc) + ' m)');
    },
    e => { setGPSStatus('GPS unavailable: ' + e.message); },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
  );
}
function getGPSForScan() {
  if (!navigator.geolocation) {
    const message = 'Location is unavailable. Enable GPS/location services to record attendance.';
    setGPSStatus('GPS unavailable');
    return Promise.reject(new Error(message));
  }
  setGPSStatus('GPS: getting a fresh location fix…');
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      p => {
        const location = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
        if (![location.lat, location.lng, location.acc].every(Number.isFinite)) {
          reject(new Error('Could not get valid GPS details. Please try again.'));
          return;
        }
        pos = location;
        setGPSStatus('GPS: ' + pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5) + ' (±' + Math.round(pos.acc) + ' m)');
        resolve(location);
      },
      e => {
        const message = e.code === 1 ? 'Location permission was denied.' :
          e.code === 2 ? 'Your current location could not be determined.' :
          e.code === 3 ? 'Timed out while getting your location.' : e.message || 'Location could not be retrieved.';
        setGPSStatus('GPS unavailable: ' + message);
        reject(new Error(message + ' Enable location access and try the scan again.'));
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
  });
}
/* Load employee names and face descriptors */
async function loadEmployees() {
  const boot = await gs('getBootData');
  if (!boot.employees) throw new Error(boot.message || 'Bad response from server');
  cfg = boot.config;
  names = {};
  enrollmentMatcher = null;
  employeeDescriptors = new Map();
  if (boot.employees.length) {
    const labeled = boot.employees.map(e => {
      names[e.id] = e.name;
      const descriptor = Float32Array.from(e.descriptor);
      employeeDescriptors.set(e.id, descriptor);
      return new faceapi.LabeledFaceDescriptors(e.id, [descriptor]);
    });
    enrollmentMatcher = new faceapi.FaceMatcher(labeled, ENROLL_DUPLICATE_THRESHOLD);
  }
}

/* ---------- Liveness check (rejects printed photos / pictures on a screen) ----------
   Require a head turn, a tilt, and a blink in a random order and direction, within a time limit. */
function eyeEAR(p) {
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  return (d(p[1], p[5]) + d(p[2], p[4])) / (2 * d(p[0], p[3]));
}
function faceMetrics(lm) {
  const p = lm.positions;
  return {
    ear: (eyeEAR(p.slice(36, 42)) + eyeEAR(p.slice(42, 48))) / 2,
    // Nose tip position between the outer eye corners: ~0.5 when facing the camera.
    // Tilting a flat photo doesn't change this ratio; turning a real head does.
    yaw: (p[30].x - p[36].x) / (p[45].x - p[36].x),
    pitch: (p[30].y - (p[36].y + p[45].y) / 2) / (p[8].y - (p[36].y + p[45].y) / 2)
  };
}
// Runs fast detection until test() returns true. Fails on timeout, lost face, extra faces or leaving the module.
async function waitFor(test, ms, my, opts) {
  const end = Date.now() + ms;
  let lost = 0;
  while (Date.now() < end) {
    if (my !== session) return false;
    const all = await faceapi.detectAllFaces($('video'), opts || detOpts()).withFaceLandmarks();
    if (all.length > 1) { badge('Only one person at a time', 'warn'); return false; }
    if (all.length === 1) {
      lost = 0;
      if (test(faceMetrics(all[0].landmarks))) return true;
    } else if (++lost > 10) { badge('Face lost', 'warn'); return false; }
    await sleep(20);
  }
  badge('Took too long', 'warn');
  return false;
}
/* Blink detection with MediaPipe Face Landmarker: it reports an eye-blink score per eye
   and runs fast enough to catch a quick blink. Loaded in the background; if it fails to
   load, the face-api eye-opening check above is used instead. */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
let blinker = null;
async function loadBlinker() {
  const vision = await import(MP + '/vision_bundle.mjs');
  const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
  const make = delegate => vision.FaceLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate
    },
    runningMode: 'VIDEO', numFaces: 2, outputFaceBlendshapes: true
  });
  try { blinker = await make('GPU'); } catch (e) { blinker = await make('CPU'); }
}
async function blinkMP(ms, my) {
  const v = $('video'), end = Date.now() + ms;
  let closed = false, lost = 0, t = 0;
  while (Date.now() < end) {
    if (my !== session) return false;
    t = Math.max(t + 1, performance.now());
    const r = blinker.detectForVideo(v, t);
    const faces = r.faceBlendshapes || [];
    if (faces.length > 1) { badge('Only one person at a time', 'warn'); return false; }
    if (faces.length === 1) {
      lost = 0;
      const s = n => (faces[0].categories.find(c => c.categoryName === n) || { score: 0 }).score;
      const shut = Math.min(s('eyeBlinkLeft'), s('eyeBlinkRight'));
      if (!closed && shut > 0.45) closed = true;
      else if (closed && shut < 0.3) return true;
    } else if (++lost > 30) { badge('Face lost', 'warn'); return false; }
    await sleep(15);
  }
  badge('Took too long', 'warn');
  return false;
}

async function liveness(my) {
  // Baseline: looking straight
  say('Look straight at the camera');
  const yaws = [], pitches = [], ears = [];
  if (!await waitFor(m => { yaws.push(m.yaw); pitches.push(m.pitch); ears.push(m.ear); return yaws.length >= 4; }, 4000, my)) return false;
  const y0 = yaws.sort((a, b) => a - b)[2];
  const pitch0 = pitches.sort((a, b) => a - b)[2];
  const earOpen = ears.sort((a, b) => a - b)[2];

  const dir = Math.random() < 0.5 ? 'LEFT' : 'RIGHT';
  const turn = async () => {
    say('Slowly turn your head to the ' + dir);
    // Camera image is not mirrored: subject's left = larger ratio
    const ok = await waitFor(m => dir === 'LEFT' ? m.yaw > y0 + 0.15 : m.yaw < y0 - 0.15, 7000, my);
    if (!ok) return false;
    say('Now look straight again');
    return waitFor(m => Math.abs(m.yaw - y0) < 0.07, 5000, my);
  };
  const blink = async () => {
    say('Blink your eyes');
    if (blinker) return blinkMP(7000, my);
    // Fallback: the 68-point model only partly closes the eyes on a blink, so look for a
    // smaller dip relative to the recent open-eye level instead of a fixed 30% drop.
    let open = earOpen, closed = false;
    return waitFor(m => {
      open = Math.max(open * 0.97, m.ear);
      if (!closed && m.ear < open * 0.8) closed = true;
      return closed && m.ear > open * 0.9;
    }, 7000, my, fastOpts());
  };
  const tilt = async () => {
    const direction = Math.random() < 0.5 ? 'UP' : 'DOWN';
    say('Tilt your head ' + direction.toLowerCase());
    const moved = await waitFor(m => direction === 'UP' ? m.pitch < pitch0 - 0.08 : m.pitch > pitch0 + 0.08, 7000, my);
    if (!moved) return false;
    say('Now look straight again');
    return waitFor(m => Math.abs(m.pitch - pitch0) < 0.04, 5000, my);
  };
  const steps = [turn, blink, tilt];
  for (let i = steps.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [steps[i], steps[j]] = [steps[j], steps[i]];
  }
  for (const step of steps) if (!await step()) return false;
  say('');
  return true;
}

/* Show result card */
function showResult(r) {
  const el = $('result');
  el.innerHTML = '';
  const add = (cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt; el.appendChild(d); };
  if (r.ok) {
    add('type ' + r.type, r.type === 'IN' ? 'TIME IN' : 'TIME OUT');
    add('name', r.name);
    add('time', r.time);
    badge('Recorded ' + r.type, 'ok');
    showModal({
      type: 'success',
      icon: '🎉',
      title: 'Congratulations!',
      message: (r.type === 'IN' ? 'Time In' : 'Time Out') + ' recorded successfully for ' + r.name + ' at ' + r.time
    });
    return true;
  } else {
    if (r.message && r.message.toLowerCase().includes('already')) {
      showModal({ type: 'warning', icon: '⚠️', title: 'Duplicate Record', message: r.message });
    } else if (r.message && r.message.toLowerCase().includes('cooldown')) {
      showModal({ type: 'warning', icon: '⚠️', title: 'Already Scanned', message: r.message });
    } else if (r.message) {
      showModal({ type: 'warning', icon: '⚠️', title: 'Notice', message: r.message });
    }
    add('type ERR', r.message || 'Error');
    if (r.name) add('name', r.name);
    badge(r.cooldown ? 'Already scanned' : 'Not recorded', 'warn');
    return false;
  }
}

async function submit(id, dist, my) {
  try {
    badge('Getting GPS location…');
    const location = await getGPSForScan();
    if (my !== session) return false;
    badge('Recording…');
    const r = await gs('recordScan', id,
      location.lat, location.lng, location.acc, dist);
    return my === session ? showResult(r) : false;
  } catch (e) {
    if (my === session) showResult({ ok: false, message: e.message || String(e) });
    return false;
  }
}

/* Scan: employee ID lookup -> liveness challenge -> compare only with that employee's face -> record */
async function verifyAndSubmit(id, my) {
  badge('Liveness check: ' + names[id]);
  if (!await liveness(my)) {
    say('');
    if (my === session) showResult({ ok: false, message: 'Liveness check failed. Select Retry face scan to try again with this ID.' });
    return false;
  }
  if (my !== session) return false;
  const faces = await faceapi.detectAllFaces($('video'), detOpts()).withFaceLandmarks().withFaceDescriptors();
  if (faces.length !== 1) {
    if (my === session) showResult({ ok: false, message: 'Show only one face to the camera and try again with this ID.' });
    return false;
  }
  const descriptor = employeeDescriptors.get(id);
  const distance = descriptor && faceapi.euclideanDistance(faces[0].descriptor, descriptor);
  if (distance === undefined || distance > cfg.threshold) {
    if (my === session) showResult({ ok: false, message: 'Face does not match employee ID ' + id + '. No attendance was recorded.' });
    return false;
  }
  return submit(id, distance, my);
}

async function runFaceScan(id, my) {
  if (busy || mode !== 'scan' || id !== activeScanId) return;
  busy = true;
  $('retryScan').disabled = true;
  $('cancelScan').disabled = true;
  try {
    $('camPane').hidden = false;
    if (!stream) {
      badge('Starting camera…');
      await startCamera();
    }
    if (my !== session || id !== activeScanId) { stopCamera(); return; }
    const recorded = await verifyAndSubmit(id, my);
    if (my === session && id === activeScanId && recorded) {
      stopCamera();
      $('camPane').hidden = true;
      $('scanActions').hidden = true;
      $('identityForm').hidden = false;
      $('identityInput').value = '';
      $('identityError').textContent = '';
      activeScanId = null;
    }
  } catch (e) {
    if (my === session) {
      showResult({ ok: false, message: 'Could not complete face scan: ' + (e.message || String(e)) });
      stopCamera();
      $('camPane').hidden = true;
    }
  } finally {
    busy = false;
    if (my === session) {
      $('retryScan').disabled = false;
      $('cancelScan').disabled = false;
    }
  }
}

$('identityForm').onsubmit = async event => {
  event.preventDefault();
  if (busy || mode !== 'scan') return;
  const submittedId = $('identityInput').value.trim();
  const my = session;
  if (!submittedId) {
    $('identityError').textContent = 'Enter your employee ID to continue.';
    return;
  }
  busy = true;
  $('identitySubmit').disabled = true;
  $('identityError').textContent = '';
  try {
    badge('Looking up employee ID…');
    await loadEmployees();
    if (my !== session) return;
    const id = Object.keys(names).find(employeeId => employeeId.toLowerCase() === submittedId.toLowerCase());
    if (!id) {
      $('identityError').textContent = 'Employee ID not found. Check the ID and try again.';
      badge('Enter a valid employee ID', 'warn');
      return;
    }
    if (!employeeDescriptors.has(id)) {
      $('identityError').textContent = 'No face record is available for this employee ID.';
      badge('No face record found', 'warn');
      return;
    }
    activeScanId = id;
    $('scanEmployee').textContent = 'Scanning for ' + names[id] + ' (ID: ' + id + ')';
    $('identityInput').value = '';
    $('identityForm').hidden = true;
    $('scanActions').hidden = false;
    $('retryScan').hidden = false;
  } catch (e) {
    if (my === session) {
      $('identityError').textContent = e.message || String(e);
      badge('Could not look up employee ID', 'bad');
    }
  } finally {
    busy = false;
    $('identitySubmit').disabled = false;
  }
  if (my === session && activeScanId) await runFaceScan(activeScanId, my);
};
$('retryScan').onclick = () => {
  if (activeScanId) runFaceScan(activeScanId, session);
};
$('cancelScan').onclick = () => {
  if (busy) return;
  activeScanId = null;
  stopCamera();
  $('camPane').hidden = true;
  $('scanActions').hidden = true;
  $('identityForm').hidden = false;
  $('identityInput').value = '';
  $('identityError').textContent = '';
  $('result').innerHTML = '<div style="color:var(--muted)">Enter your employee ID to begin a face scan</div>';
  badge('Enter employee ID to begin');
  $('identityInput').focus();
};

/* Enrollment (with liveness + duplicate ID / name / face checks) */
const normalizeEmployeeId = value => value.replace(/\s+/g, '').toLocaleUpperCase();
const properCaseName = value => value.replace(/\s+/g, ' ').trim().toLocaleLowerCase().replace(/(^|[\s'-])(\p{L})/gu,
  (_, separator, letter) => separator + letter.toLocaleUpperCase());
const normName = n => n.toLowerCase().replace(/\s+/g, ' ').trim();
$('btnEnroll').onclick = async () => {
  const pin = $('pin').value;
  const id = normalizeEmployeeId($('empId').value);
  const name = properCaseName($('empName').value);
  $('empId').value = id;
  $('empName').value = name;
  const msg = t => { $('enrollMsg').textContent = t; };
  if (!pin || !id || !name) { msg('Please fill in PIN, ID and name.'); return; }
  const my = session;
  busy = true; $('btnEnroll').disabled = true;
  $('btnEnroll').classList.remove('is-saving');
  $('btnEnroll').classList.add('is-capturing');
  try {
    msg('Checking for duplicates…');
    await loadEmployees(); // latest list, in case another device enrolled someone
    const idTaken = Object.keys(names).find(k => normalizeEmployeeId(k) === id);
    if (idTaken) { 
      const msgTxt = 'Employee ID ' + idTaken + ' is already enrolled (' + names[idTaken] + ').';
      msg(msgTxt); 
      showModal({ type: 'warning', icon: '⚠️', title: 'Duplicate Record', message: msgTxt });
      return; 
    }
    const nameTaken = Object.keys(names).find(k => normName(names[k]) === normName(name));
    if (nameTaken) { 
      const msgTxt = names[nameTaken] + ' is already enrolled under ID ' + nameTaken + '.';
      msg(msgTxt); 
      showModal({ type: 'warning', icon: '⚠️', title: 'Duplicate Record', message: msgTxt });
      return; 
    }

    msg('Liveness check — follow the instructions on the camera');
    if (!await liveness(my)) { say(''); msg('Liveness check failed. The real person must be in front of the camera.'); return; }

    msg('Capturing… hold still and look at the camera');
    const samples = [];
    for (let i = 0; i < 12 && samples.length < 5; i++) {
      const d = await faceapi.detectSingleFace($('video'), detOpts()).withFaceLandmarks().withFaceDescriptor();
      if (d) samples.push(d.descriptor);
      await sleep(300);
    }
    if (samples.length < 3) { msg('Could not see a clear face. Try again with better light.'); return; }
    const avg = new Array(128).fill(0);
    samples.forEach(s => s.forEach((v, i) => { avg[i] += v / samples.length; }));

    if (enrollmentMatcher) {
      const m = enrollmentMatcher.findBestMatch(Float32Array.from(avg));
      if (m.label !== 'unknown') { 
        const msgTxt = 'This face is already enrolled as ' + names[m.label] + ' (ID ' + m.label + ').';
        msg(msgTxt); 
        showModal({ type: 'warning', icon: '⚠️', title: 'Duplicate Record', message: msgTxt });
        return; 
      }
    }

    $('btnEnroll').classList.remove('is-capturing');
    $('btnEnroll').classList.add('is-saving');
    msg('Saving…');
    const r = await gs('enrollEmployee', pin, id, name, avg);
    msg(r.message);
    if (r.ok) { 
      showModal({
        type: 'success',
        icon: '🎉',
        title: 'Congratulations!',
        message: name + ' (ID: ' + id + ') has been enrolled successfully!'
      });
      $('empId').value = ''; $('empName').value = ''; await loadEmployees(); 
    } else if (r.message && r.message.toLowerCase().includes('duplicate')) {
      showModal({
        type: 'warning',
        icon: '⚠️',
        title: 'Duplicate Record',
        message: r.message
      });
    } else if (r.message) {
      showModal({
        type: 'warning',
        icon: '⚠️',
        title: 'Notice',
        message: r.message
      });
    }
  } catch (e) {
    msg('Error: ' + (e.message || e));
  } finally {
    say('');
    busy = false; $('btnEnroll').disabled = false;
    $('btnEnroll').classList.remove('is-capturing', 'is-saving');
  }
};

/* Init: load models + employees on the home screen; camera starts only after a choice */
(async function init() {
  $('chooseScan').disabled = $('chooseEnroll').disabled = true;
  loadBlinker().catch(e => console.warn('MediaPipe blink detector unavailable, using fallback', e));
  startGPS();
  try {
    $('homeMsg').textContent = 'Loading face models…';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    $('homeMsg').textContent = 'Loading employees…';
    await loadEmployees();
    $('homeMsg').textContent = '';
    $('chooseScan').disabled = $('chooseEnroll').disabled = false;
  } catch (e) {
    $('homeMsg').textContent = 'Error: ' + (e.message || e);
  }
})();

      <button class="modal-btn" id="modalBtn">OK</button>
